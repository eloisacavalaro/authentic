<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado — AUTHENTIC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    
    <link rel="stylesheet" href="../css/pedido-confirmado-inline.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">AUTHENTIC</a>
        <div class="seguro">🔒 Compra segura</div>
    </header>

    <main>
        <section class="confirmacao">
            <div class="icone">✓</div>
            <h1>Pedido registrado!</h1>
            <p class="mensagem">
                Obrigado pela sua compra. Seu pedido foi registrado com sucesso e já está sendo preparado pela nossa
                equipe.
            </p>

            <div class="pedido-box">
                <div class="pedido-label">Número do pedido</div>
                <div id="numero-pedido">#---</div>
            </div>

            <div class="informacoes">
                <div class="informacao">
                    <span>Recebimento</span>
                    <span id="recebimento">---</span>
                </div>
                <div class="informacao">
                    <span>Pagamento</span>
                    <span id="pagamento">---</span>
                </div>
                <div class="informacao">
                    <span>Total do pedido</span>
                    <span id="total">R$ 0,00</span>
                </div>
            </div>

            <div class="botoes">
                <a href="conta.html" class="botao botao-principal">ACOMPANHAR PEDIDO</a>
                <a href="produtos.html" class="botao botao-secundario">CONTINUAR COMPRANDO</a>
            </div>
        </section>
    </main>

    

    <script src="../js/pedido-confirmado-inline.js"></script>
</body>

</html>
