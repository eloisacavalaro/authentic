<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — AUTHENTIC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/cadastro.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <main class="auth-page">

        <a href="index.html" class="logo">
            AUTHENTIC
        </a>

        <section class="auth-box">

            <div class="auth-header">
                <p class="eyebrow">AUTHENTIC MEMBERS</p>
                <h1>Criar conta</h1>
                <p>Crie sua conta e acompanhe todos os seus pedidos.</p>
            </div>

            <form id="register-form" novalidate>

                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required
                        autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel"
                        maxlength="15">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" minlength="8" required
                        autocomplete="new-password">
                    <small>A senha deve ter pelo menos 8 caracteres.</small>
                </div>

                <div class="form-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha"
                        placeholder="Digite a senha novamente" minlength="8" required autocomplete="new-password">
                </div>

                <label class="terms">
                    <input type="checkbox" id="termos" required>
                    <span>Concordo com os termos de uso e política de privacidade.</span>
                </label>

                <button type="submit" class="auth-button">
                    CRIAR CONTA
                </button>

            </form>

            <div class="auth-divider">
                <span>ou</span>
            </div>

            <p class="register-link">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>

        <a href="index.html" class="back-home">
            ← Voltar para a loja
        </a>

    </main>

    <script src="../js/cadastro.js"></script>

</body>

</html>
